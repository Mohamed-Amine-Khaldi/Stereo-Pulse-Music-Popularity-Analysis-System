  </defs>

  <!-- vinyl disc -->
  <circle cx="160" cy="105" r="78" fill="#0a0e27" stroke="url(#ring)" stroke-width="2.5"/>
  <circle cx="160" cy="105" r="60" fill="none" stroke="#2a3268" stroke-width="1.5"/>
  <circle cx="160" cy="105" r="44" fill="none" stroke="#2a3268" stroke-width="1.5"/>
  <circle cx="160" cy="105" r="28" fill="none" stroke="#2a3268" stroke-width="1.5"/>
  <circle cx="160" cy="105" r="13" fill="#ffb454"/>
  <circle cx="160" cy="105" r="4" fill="#0a0e27"/>

